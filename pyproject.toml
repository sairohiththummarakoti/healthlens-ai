[project]
name = "healthlens-ai"
version = "0.1.0"
description = "Verified longitudinal health insights for synthetic-data demonstrations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
dataset = ["pyarrow>=20,<24"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.uv]
package = false
